name: Supabase keep-alive

# Free-tier Supabase projects are paused after 7 days with no DATABASE activity
# (Supabase's own criterion: "no API requests, no database queries, and no Edge
# Function invocations" — dashboard visits and non-DB-touching pings don't count).
# This job makes a lightweight authenticated REST (PostgREST) request against a
# real table every 2 days so the project keeps counting as active. It also runs
# on demand from the Actions tab (workflow_dispatch).
#
# IMPORTANT: two earlier versions did NOT keep the project awake, though both ran
# green: /auth/v1/health never touches Postgres, and an RLS-rejected request
# (HTTP 401, code 42501) is also not counted as activity — Supabase paused the project
# on 2026-10-20 despite weeks of green runs. This now calls public.keepalive(), an
# anon-executable SECURITY DEFINER function (see supabase/migration.sql) that runs a
# real query against saved_calculations and returns 0/1. Only a plain HTTP 200 is
# accepted; anything else fails the job (GitHub emails you about failed scheduled runs).
#
# The values below are PUBLIC: the project URL appears in every request and the
# `sb_publishable_...` key is the anon/publishable key that already ships in the
# volteq.io browser bundle — so keeping them here exposes nothing new. If you ever
# rotate the publishable key or move the project, update the two lines below.
#
# Note: GitHub disables scheduled workflows after 60 days with no repository
# activity (commits) — not a concern for an actively developed repo, but you can
# always re-enable it from the Actions tab, or trigger a manual run.

on:
  schedule:
    - cron: '23 5 */2 * *' # every 2 days at 05:23 UTC — comfortably inside the 7-day window
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real database query via RPC)
        run: |
          SUPABASE_URL="https://hxqnhhbbynsursaikyds.supabase.co"
          SUPABASE_ANON_KEY="sb_publishable_7L6oroZUHrY-A_wgEbITCw_ibadgVGz"
          echo "Calling ${SUPABASE_URL}/rest/v1/rpc/keepalive ..."
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" -d '{}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors)
          echo "HTTP ${code}"
          cat /tmp/body.txt || true
          echo
          if [ "${code}" = "200" ]; then
            echo "✅ keepalive() returned 200 — a real query ran, inactivity timer reset."
          else
            echo "::error::Unexpected HTTP ${code}. The project may be paused, keepalive() may be missing (run the end of supabase/migration.sql), or the publishable key was rotated."
            exit 1
          fi
